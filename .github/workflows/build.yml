# The second robot. Wakes up ONLY when something joins main (a merge) —
# never on PRs. Its job: build the sealed package, exactly once, and tag it
# with the commit it came from. Deploying is a separate, later act.
name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, staging]
    steps:
      - uses: actions/checkout@v4

      - name: Build the sealed package
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker build --build-arg GIT_SHA=$SHA -t demo-service:git-$SHA .
          echo "built demo-service:git-$SHA"

      # Replace whatever runs on the integration server with the package we
      # just built, then prove the NEW version is the one answering (smoke
      # test) — if it isn't, this step fails and the run goes red.
      - name: Deploy to integration server
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker rm -f demo-service-staging 2>/dev/null || true
          docker run -d --name demo-service-staging --restart unless-stopped \
            -p 8081:8000 demo-service:git-$SHA
          sleep 2
          docker exec demo-service-staging python3 -c \
            "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/').read().decode())" \
            | grep $SHA

      # End-to-end test: hit the running service through its published port,
      # exactly like a real client would. A throwaway container with host
      # networking plays the client (direct container->host routing is
      # firewalled on this machine). If staging misbehaves, this goes red —
      # and a red staging blocks any release tag.
      - name: End-to-end test on staging
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker run --rm --network host demo-service:git-$SHA python3 -c "import json,urllib.request; b=json.load(urllib.request.urlopen('http://localhost:8081/',timeout=5)); assert b['service']=='demo-service', b; assert b['git_sha']=='$SHA', b; print('e2e ok:', b)"
