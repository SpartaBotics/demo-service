# The robot check (gate 1 of the standard).
#
# Runs on every proposed change, on a fresh machine, so it catches what a
# laptop cannot: leftover local junk and clashes with freshly merged work.
# Nothing is built for keeps here and nothing is deployed — this only decides
# whether the merge button should be unlocked.
#
# runs-on is GitHub-hosted for now; switching to the company's self-hosted
# ephemeral runners later is a one-line change (runs-on: [self-hosted, zone-build]).
name: verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Security audit
        run: make security

      # Proves the sealed package builds; the image is thrown away with the
      # runner. The one real build happens only on merge to main (build.yml).
      - name: Build
        run: make build
